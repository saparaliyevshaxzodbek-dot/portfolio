<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="80%" cy="10%" r="70%"><stop offset="0" stop-color="#10b981" stop-opacity=".45"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="10%" cy="95%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f2a"/><stop offset="1" stop-color="#12151d"/></linearGradient>
    <linearGradient id="btn" x1="0" x2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="#0a0d12"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <text x="120" y="190" fill="#6ee7b7" font-size="30" font-weight="700" letter-spacing="6">ASP.NET CORE MVC</text>
  <text x="120" y="290" fill="#ffffff" font-size="96" font-weight="800">SportsStore</text>
  <text x="120" y="350" fill="#94a3b8" font-size="34">Catalog · Cart · Checkout · Admin</text>

  <!-- Window -->
  <g transform="translate(120 430)">
    <rect width="1360" height="500" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="40" cy="38" r="8" fill="#f87171"/><circle cx="66" cy="38" r="8" fill="#fbbf24"/><circle cx="92" cy="38" r="8" fill="#34d399"/>
    <rect x="130" y="24" width="360" height="28" rx="8" fill="#ffffff" fill-opacity=".06"/>
    <text x="146" y="44" fill="#64748b" font-size="16" font-family="Consolas, monospace">sportsstore/products/page-1</text>
    <line x1="0" y1="76" x2="1360" y2="76" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- Category sidebar -->
    <g font-size="20" fill="#cbd5e1">
      <rect x="40" y="110" width="220" height="48" rx="12" fill="url(#btn)"/><text x="62" y="141" fill="#04120c" font-weight="700">All products</text>
      <text x="62" y="201">Watersports</text><text x="62" y="251">Soccer</text><text x="62" y="301">Chess</text><text x="62" y="351">Running</text>
    </g>

    <!-- Product cards -->
    <g font-size="20">
      <g transform="translate(300 110)">
        <rect width="320" height="340" rx="20" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
        <rect x="20" y="20" width="280" height="150" rx="14" fill="#10b981" fill-opacity=".18"/>
        <circle cx="160" cy="95" r="44" fill="none" stroke="#6ee7b7" stroke-width="6"/><path d="M128 95h64M160 63v64" stroke="#6ee7b7" stroke-width="5"/>
        <text x="20" y="210" fill="#ffffff" font-weight="700" font-size="24">Soccer Ball</text>
        <text x="20" y="242" fill="#94a3b8" font-size="18">FIFA-approved size and weight</text>
        <text x="20" y="300" fill="#6ee7b7" font-weight="800" font-size="26">$19.50</text>
        <rect x="190" y="272" width="110" height="42" rx="12" fill="url(#btn)"/><text x="213" y="300" fill="#04120c" font-weight="700" font-size="18">Add</text>
      </g>
      <g transform="translate(650 110)">
        <rect width="320" height="340" rx="20" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
        <rect x="20" y="20" width="280" height="150" rx="14" fill="#22d3ee" fill-opacity=".16"/>
        <path d="M95 120c30-60 100-60 130 0" fill="none" stroke="#67e8f9" stroke-width="6"/><path d="M90 128h140" stroke="#67e8f9" stroke-width="6"/>
        <text x="20" y="210" fill="#ffffff" font-weight="700" font-size="24">Kayak</text>
        <text x="20" y="242" fill="#94a3b8" font-size="18">A boat for one person</text>
        <text x="20" y="300" fill="#6ee7b7" font-weight="800" font-size="26">$275.00</text>
        <rect x="190" y="272" width="110" height="42" rx="12" fill="url(#btn)"/><text x="213" y="300" fill="#04120c" font-weight="700" font-size="18">Add</text>
      </g>
      <g transform="translate(1000 110)">
        <rect width="320" height="340" rx="20" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="20" y="48" fill="#ffffff" font-weight="700" font-size="24">Your cart</text>
        <g font-size="18" fill="#cbd5e1">
          <text x="20" y="98">2 × Soccer Ball</text><text x="300" y="98" text-anchor="end">$39.00</text>
          <text x="20" y="138">1 × Kayak</text><text x="300" y="138" text-anchor="end">$275.00</text>
          <text x="20" y="178">1 × Lifejacket</text><text x="300" y="178" text-anchor="end">$48.95</text>
        </g>
        <line x1="20" y1="206" x2="300" y2="206" stroke="#ffffff" stroke-opacity=".1"/>
        <text x="20" y="246" fill="#94a3b8" font-size="18">Total</text><text x="300" y="246" text-anchor="end" fill="#ffffff" font-weight="800" font-size="24">$362.95</text>
        <rect x="20" y="272" width="280" height="46" rx="12" fill="url(#btn)"/><text x="160" y="302" text-anchor="middle" fill="#04120c" font-weight="700" font-size="19">Checkout</text>
      </g>
    </g>
  </g>
</svg>
