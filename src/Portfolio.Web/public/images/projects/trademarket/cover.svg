<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="85%" cy="15%" r="70%"><stop offset="0" stop-color="#f59e0b" stop-opacity=".38"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="5%" cy="90%" r="60%"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="layer" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="#0c0a12"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>

  <text x="120" y="190" fill="#fcd34d" font-size="30" font-weight="700" letter-spacing="6">ASP.NET CORE WEB API</text>
  <text x="120" y="290" fill="#ffffff" font-size="96" font-weight="800">TradeMarket</text>
  <text x="120" y="350" fill="#94a3b8" font-size="34">Layered marketplace back end</text>

  <!-- Layers -->
  <g font-size="26" font-weight="700">
    <g transform="translate(120 430)">
      <rect width="560" height="120" rx="24" fill="#ffffff" fill-opacity=".04" stroke="url(#layer)" stroke-width="2"/>
      <text x="36" y="56" fill="#ffffff">Web API</text><text x="36" y="92" fill="#94a3b8" font-size="20" font-weight="400">REST controllers · validation · Swagger</text>
    </g>
    <g transform="translate(120 590)">
      <rect width="560" height="120" rx="24" fill="#ffffff" fill-opacity=".04" stroke="url(#layer)" stroke-width="2"/>
      <text x="36" y="56" fill="#ffffff">Business</text><text x="36" y="92" fill="#94a3b8" font-size="20" font-weight="400">Services · AutoMapper · rules</text>
    </g>
    <g transform="translate(120 750)">
      <rect width="560" height="120" rx="24" fill="#ffffff" fill-opacity=".04" stroke="url(#layer)" stroke-width="2"/>
      <text x="36" y="56" fill="#ffffff">Data</text><text x="36" y="92" fill="#94a3b8" font-size="20" font-weight="400">EF Core · Repositories · Unit of Work</text>
    </g>
    <path d="M400 550v40M400 710v40" stroke="#fcd34d" stroke-width="3" stroke-dasharray="6 6"/>
  </g>

  <!-- Endpoints panel -->
  <g transform="translate(760 430)">
    <rect width="720" height="440" rx="28" fill="#15121d" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="36" y="60" fill="#ffffff" font-size="26" font-weight="700">Endpoints</text>
    <g font-family="Consolas, monospace" font-size="21">
      <g transform="translate(36 100)"><rect width="80" height="34" rx="8" fill="#10b981" fill-opacity=".2"/><text x="40" y="24" text-anchor="middle" fill="#6ee7b7" font-weight="700">GET</text><text x="100" y="24" fill="#e2e8f0">/api/products?categoryId=3</text></g>
      <g transform="translate(36 152)"><rect width="80" height="34" rx="8" fill="#f59e0b" fill-opacity=".2"/><text x="40" y="24" text-anchor="middle" fill="#fcd34d" font-weight="700">PUT</text><text x="100" y="24" fill="#e2e8f0">/api/receipts/{id}/products/add/{pid}/{qty}</text></g>
      <g transform="translate(36 204)"><rect width="80" height="34" rx="8" fill="#10b981" fill-opacity=".2"/><text x="40" y="24" text-anchor="middle" fill="#6ee7b7" font-weight="700">GET</text><text x="100" y="24" fill="#e2e8f0">/api/customers/{id}</text></g>
      <g transform="translate(36 256)"><rect width="80" height="34" rx="8" fill="#8b5cf6" fill-opacity=".25"/><text x="40" y="24" text-anchor="middle" fill="#c4b5fd" font-weight="700">PUT</text><text x="100" y="24" fill="#e2e8f0">/api/receipts/{id}/checkout</text></g>
      <g transform="translate(36 308)"><rect width="80" height="34" rx="8" fill="#10b981" fill-opacity=".2"/><text x="40" y="24" text-anchor="middle" fill="#6ee7b7" font-weight="700">GET</text><text x="100" y="24" fill="#e2e8f0">/api/statistic/popularProducts</text></g>
    </g>
    <g transform="translate(36 380)" font-size="19">
      <rect width="300" height="36" rx="18" fill="#10b981" fill-opacity=".15"/><text x="20" y="24" fill="#6ee7b7">✓ All tests passed</text>
      <rect x="316" width="300" height="36" rx="18" fill="#8b5cf6" fill-opacity=".2"/><text x="336" y="24" fill="#c4b5fd">0 warnings · StyleCop</text>
    </g>
  </g>
</svg>
